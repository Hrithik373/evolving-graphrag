# The whole suite runs with no daemons and no API key: memory store, inline queue, mock
# LLM backend. That is a deliberate property of the design, not a CI shortcut — the churn
# semantics under test are identical whichever backend is configured.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: lint
        run: |
          ruff check src tests fixtures scripts
          black --check src tests fixtures scripts
      - name: test
        run: pytest -q
      - name: the eval must reproduce end to end
        run: |
          python -m egraph.cli eval --output results --quick
          python scripts/make_figures.py --results results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-py${{ matrix.python-version }}
          path: results/

  # The Louvain fallback is what runs where igraph cannot be built, so it gets its own job.
  compaction-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: compaction tests without leidenalg
        run: pytest tests/test_compaction.py -q

  store-parity:
    runs-on: ubuntu-latest
    services:
      arcadedb:
        image: arcadedata/arcadedb:24.11.1
        ports: ["2480:2480"]
        env:
          JAVA_OPTS: >-
            -Darcadedb.server.rootPassword=playwithdata
            -Darcadedb.server.defaultDatabases=egraph_parity[root]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: wait for arcadedb
        run: |
          for i in $(seq 1 60); do
            curl -sf -u root:playwithdata http://localhost:2480/api/v1/databases && exit 0
            sleep 2
          done
          echo "ArcadeDB did not come up" && exit 1
      - name: ArcadeDB must match the memory store
        env:
          EGRAPH_ARCADEDB_URL: http://localhost:2480
          EGRAPH_ARCADEDB_PASSWORD: playwithdata
        run: pytest tests/test_store_parity.py -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the compose images must build
        run: |
          docker build --target api -t egraph-api .
          docker build --target worker -t egraph-worker .
          docker build -t egraph-frontend ./frontend
