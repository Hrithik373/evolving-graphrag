[project]
name = "evolving-graphrag"
version = "0.1.0"
description = "Incrementally-maintained GraphRAG: provenance-first churn, selective community recompute, cost-vs-freshness evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "evolving-graphrag" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "prometheus-client>=0.21",
    "arq>=0.26",
    "redis>=5.2",
    "python-multipart>=0.0.12",
    "typer>=0.15",
    "rich>=13.9",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
# Heavier, entirely optional backends. The system runs end-to-end without any of these.
leiden = ["python-igraph>=0.11", "leidenalg>=0.10"]
embeddings = ["sentence-transformers>=3.3"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
]

[project.scripts]
egraph = "egraph.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/egraph"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
