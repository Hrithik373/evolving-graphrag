<text x="382.0" y="408" text-anchor="middle" font-size="11" fill="#52514e">update tokens (churn + deletion phase)</text>
<text x="78.0" y="386" text-anchor="middle" font-size="10.5" fill="#898781">0</text>
<text x="230.0" y="386" text-anchor="middle" font-size="10.5" fill="#898781">25.0k</text>
